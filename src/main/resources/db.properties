# Non-secret database settings. The connection details and password are NOT stored here:
# they are read from a .env file (see .env.example), which is kept out of git.
#   Development: put .env in the project folder (next to pom.xml).
#   Installed app: put .env next to the jar, e.g. %LOCALAPPDATA%\MyStorePOS\app\.env
# DB_URL, DB_USER, DB_PASSWORD and DB_POOL_SIZE can also be set as real environment variables.
# How many connections this PC keeps open to Supabase.
db.pool.size=5
